name: Set up workspace
description: Install Node, pnpm, and workspace dependencies with CI caches

inputs:
  node-version:
    description: Node version for this job
    required: true
  registry-url:
    description: Registry configured by setup-node, when needed
    default: ''
  turbo-cache:
    description: Restore the Turbo cache for this job
    default: 'true'

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        registry-url: ${{ inputs.registry-url }}
    - name: Restore Turbo cache
      if: ${{ inputs.turbo-cache == 'true' }}
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: .turbo
        key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-turbo-${{ github.job }}-
          ${{ runner.os }}-turbo-
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
