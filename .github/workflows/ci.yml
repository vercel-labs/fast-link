name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  paths:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lightweight: ${{ steps.changes.outputs.lightweight }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check changed paths
        id: changes
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          diff_file=$(mktemp "$RUNNER_TEMP/fast-link-paths.XXXXXX")
          git diff --name-status -z --find-renames "$PR_BASE" "$PR_HEAD" > "$diff_file"

          allowed_path() {
            [[ "$1" == skills/fast-link/* ]] ||
              [[ "$1" == docs/*.md ]] ||
              [[ "$1" == *.md && "$1" != */* ]]
          }

          changed=0
          lightweight=true
          while IFS= read -r -d '' status && IFS= read -r -d '' path; do
            changed=1
            if ! allowed_path "$path"; then lightweight=false; fi
            if [[ "$status" == R* || "$status" == C* ]]; then
              IFS= read -r -d '' destination
              if ! allowed_path "$destination"; then lightweight=false; fi
            fi
          done < "$diff_file"

          if [[ "$changed" == 0 ]]; then lightweight=false; fi
          echo "lightweight=$lightweight" >> "$GITHUB_OUTPUT"

  validate:
    needs: paths
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fail when path detection fails
        if: ${{ needs.paths.result != 'success' }}
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "24"
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Check package release intent
        run: node scripts/check-package-version.mjs "${{ github.event.pull_request.base.sha }}"

      - name: Restore Turbo cache
        if: ${{ needs.paths.outputs.lightweight != 'true' }}
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate formatting
        if: ${{ needs.paths.outputs.lightweight == 'true' }}
        run: pnpm exec turbo run //#format

      - name: Check package boundaries
        if: ${{ needs.paths.outputs.lightweight != 'true' }}
        run: pnpm boundaries

      - name: Validate formatting, builds, types, tests, and size
        if: ${{ needs.paths.outputs.lightweight != 'true' }}
        run: pnpm exec turbo run //#format //#lint //#test:root build typecheck test size

      - name: Pack and inspect packages
        if: ${{ needs.paths.outputs.lightweight != 'true' }}
        run: |
          for package_dir in packages/core packages/react packages/next; do
            archive="$RUNNER_TEMP/$(basename "$package_dir").tgz"
            pnpm --dir "$package_dir" pack --out "$archive"
            node scripts/verify-packed-package.mjs "$archive" "$package_dir"
            tar -tf "$archive"
          done

  browser:
    needs: paths
    if: ${{ needs.paths.result == 'success' && needs.paths.outputs.lightweight != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Restore Turbo cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browsers
        run: pnpm --filter @fast-link/core exec playwright install --with-deps chromium firefox webkit

      - name: Run browser and App Router tests
        run: pnpm exec turbo run test:browser test:fixtures

  packed-consumers:
    needs: paths
    if: ${{ needs.paths.result == 'success' && needs.paths.outputs.lightweight != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore Turbo cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ matrix.node }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-${{ matrix.node }}-
      - name: Build and pack on Node.js 24
        run: |
          pnpm exec turbo run build --filter=@fast-link/core --filter=@fast-link/react --filter=@fast-link/next
          mkdir -p "$RUNNER_TEMP/fast-link-packed"
          for package_dir in packages/core packages/react packages/next; do
            pnpm --dir "$package_dir" pack --out "$RUNNER_TEMP/fast-link-packed/$(basename "$package_dir").tgz"
          done
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: ${{ matrix.node }}
          registry-url: https://registry.npmjs.org
      - name: Verify isolated packed consumers
        run: node scripts/test-packed-consumers.mjs "$RUNNER_TEMP/fast-link-packed"
