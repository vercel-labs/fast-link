name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_packages: ${{ steps.releases.outputs.has_packages }}
      has_publishable_packages: ${{ steps.releases.outputs.has_publishable_packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Detect unpublished versions
        id: releases
        run: node scripts/detect-package-releases.mjs >> "$GITHUB_OUTPUT"

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "24"
          cache: pnpm
      - name: Restore Turbo cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-
            ${{ runner.os }}-turbo-

      - run: pnpm install --frozen-lockfile
      - run: pnpm boundaries
      - run: pnpm exec turbo run //#format //#lint //#test:root build typecheck test size

      - name: Prepare and inspect release archives
        run: node scripts/prepare-package-artifacts.mjs "$RUNNER_TEMP/fast-link-packed" "${{ github.sha }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fast-link-packed
          path: ${{ runner.temp }}/fast-link-packed
          if-no-files-found: error
          retention-days: 7

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "24"
          cache: pnpm
      - name: Restore Turbo cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-
            ${{ runner.os }}-turbo-

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fast-link/core exec playwright install --with-deps chromium firefox webkit
      - run: pnpm exec turbo run test:browser test:fixtures

  packed-consumers:
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: ${{ matrix.node }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fast-link-packed
          path: ${{ runner.temp }}/fast-link-packed
      - name: Verify isolated packed consumers
        run: node scripts/test-packed-consumers.mjs "$RUNNER_TEMP/fast-link-packed" "${{ github.sha }}"

  publish:
    needs: [detect, validate, browser, packed-consumers]
    if: ${{ github.ref == 'refs/heads/main' && needs.detect.outputs.has_packages == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fast-link-packed
          path: ${{ runner.temp }}/fast-link-packed

      - name: Install provenance-capable npm
        run: |
          set -eo pipefail
          verify_sigstore() {
            node -e "require.resolve('sigstore', { paths: ['$(npm root -g)/npm/node_modules/libnpmpublish/lib'] })"
          }
          npm install -g npm@11.13.0 --force --registry=https://registry.npmjs.org
          if ! verify_sigstore; then
            npm install -g npm@11.13.0 --force --registry=https://registry.npmjs.org
            verify_sigstore
          fi

      - name: Publish packages in dependency order
        run: node scripts/publish-package-releases.mjs "$RUNNER_TEMP/fast-link-packed"

  release:
    needs: [detect, validate, browser, packed-consumers, publish]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.detect.result == 'success' && needs.detect.outputs.has_publishable_packages == 'true' && needs.validate.result == 'success' && needs.browser.result == 'success' && needs['packed-consumers'].result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Recover package tags and GitHub Releases
        run: node scripts/create-package-releases.mjs
        env:
          GH_TOKEN: ${{ github.token }}

  benchmarks:
    needs: [publish]
    if: ${{ needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency: benchmark-release-results
    steps:
      - name: Start elapsed-time measurement
        run: echo "BENCHMARK_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          path: head
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Find previous measured release
        id: baseline
        working-directory: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/benchmarks/baseline.mjs
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        if: steps.baseline.outputs.revision != ''
        with:
          ref: ${{ steps.baseline.outputs.revision }}
          path: base
          persist-credentials: false
      - uses: pnpm/action-setup@26f6d4f2c533a43e6b5da0b4a5dd983f98f7b49a # v6.0.4
        with:
          package_json_file: head/package.json

      - name: Install dependencies and Chromium
        working-directory: head
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Compare with previous release
        if: steps.baseline.outputs.revision != ''
        working-directory: head
        run: node scripts/benchmarks/compare.mjs --base ../base --output "$RUNNER_TEMP/benchmark-results" --informational
      - name: Measure first release
        if: steps.baseline.outputs.revision == ''
        working-directory: head
        run: |
          pnpm build
          node scripts/benchmarks/run.mjs --output "$RUNNER_TEMP/benchmark-results/0-head.json"

      - name: Record full elapsed time
        if: always()
        run: node head/scripts/benchmarks/ci.mjs elapsed

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: release-benchmarks-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/benchmark-results
          retention-days: 90

      - name: Save durable results and open README PR
        working-directory: head
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ steps.baseline.outputs.revision }}
        run: |
          args=()
          if [ -n "$PREVIOUS" ]; then args+=("$RUNNER_TEMP/benchmark-results/0-base.json"); fi
          node scripts/benchmarks/publish.mjs "$RUNNER_TEMP/benchmark-results" "$RUNNER_TEMP/benchmark-results/0-head.json" "${args[@]}"
