name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_packages: ${{ steps.releases.outputs.has_packages }}
      has_publishable_packages: ${{ steps.releases.outputs.has_publishable_packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Detect unpublished versions
        id: releases
        run: node scripts/release/detect-package-releases.mjs >> "$GITHUB_OUTPUT"

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: "24"
      - run: pnpm boundaries
      - run: pnpm exec turbo run //#format //#lint //#test:root build typecheck test size

      - name: Prepare and inspect release archives
        run: node scripts/packaging/prepare-package-artifacts.mjs "$RUNNER_TEMP/fast-link-packed" "${{ github.sha }}"
      - name: Install minimum compatibility browser
        run: bash scripts/ci/install-browsers.sh --only-shell chromium
      - name: Verify packed minimum framework compatibility
        run: node scripts/packaging/test-packed-consumers.mjs "$RUNNER_TEMP/fast-link-packed" "${{ github.sha }}" --minimum
      - name: Upload browser failure artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ failure() }}
        with:
          name: browser-failures-${{ github.job }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fast-link-packed
          path: ${{ runner.temp }}/fast-link-packed
          if-no-files-found: error
          retention-days: 7

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: "24"
      - run: bash scripts/ci/install-browsers.sh chromium firefox webkit
      - run: pnpm exec turbo run test:browser test:fixtures

      - name: Upload browser failure artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ failure() }}
        with:
          name: browser-failures-${{ github.job }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

  packed-consumers:
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: ${{ matrix.node }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fast-link-packed
          path: ${{ runner.temp }}/fast-link-packed
      - name: Verify isolated packed consumers
        run: node scripts/packaging/test-packed-consumers.mjs "$RUNNER_TEMP/fast-link-packed" "${{ github.sha }}"

  publish:
    needs: [detect, validate, browser, packed-consumers]
    if: ${{ github.ref == 'refs/heads/main' && needs.detect.outputs.has_packages == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fast-link-packed
          path: ${{ runner.temp }}/fast-link-packed

      - name: Install provenance-capable npm
        run: |
          set -eo pipefail
          verify_sigstore() {
            node -e "require.resolve('sigstore', { paths: ['$(npm root -g)/npm/node_modules/libnpmpublish/lib'] })"
          }
          npm install -g npm@11.13.0 --force --registry=https://registry.npmjs.org
          if ! verify_sigstore; then
            npm install -g npm@11.13.0 --force --registry=https://registry.npmjs.org
            verify_sigstore
          fi
          npm --version

      - name: Publish packages in dependency order
        run: node scripts/release/publish-package-releases.mjs "$RUNNER_TEMP/fast-link-packed"
        env:
          NPM_CONFIG_LOGLEVEL: verbose

  release:
    needs: [detect, validate, browser, packed-consumers, publish]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.detect.result == 'success' && needs.detect.outputs.has_publishable_packages == 'true' && needs.validate.result == 'success' && needs.browser.result == 'success' && needs['packed-consumers'].result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Recover package tags
        run: node scripts/release/create-package-tags.mjs
        env:
          GH_TOKEN: ${{ github.token }}
